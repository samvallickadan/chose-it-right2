<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I have a question for you!</title>
    <!-- Importing cute fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #ff4d6d;
            --secondary-pink: #ffb3c1;
            --bg-light: #fff0f3;
            --text-color: #590d22;
        }

        body, html {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            /* Dynamic animated gradient background */
            background: linear-gradient(-45deg, #ffe6ea, #ffccd5, #ffb3c1, #ff8fa3);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Background Hearts */
        .bg-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.3);
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 6s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg) scale(1.5); opacity: 0; }
        }

        /* Main Container Card */
        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 40px;
            box-shadow: 0 20px 50px rgba(255, 77, 109, 0.3);
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 3px solid white;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Shake effect for when No is approached */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .mascot {
            font-size: 90px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite ease-in-out;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: var(--text-color);
            font-size: 2.8rem;
            margin: 0 0 30px 0;
            line-height: 1.2;
            text-shadow: 2px 2px 0px rgba(255,255,255,0.5);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 120px;
            position: relative;
        }

        button {
            padding: 16px 38px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.2);
            outline: none;
        }

        #yesBtn {
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
            color: white;
            position: relative;
            z-index: 20;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(255, 77, 109, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 77, 109, 0); }
        }

        #noBtn {
            background-color: #f8f9fa;
            color: #adb5bd;
            position: relative;
            z-index: 999;
            transition: left 0.15s ease-out, top 0.15s ease-out, transform 0.2s;
            white-space: nowrap;
        }

        /* Celebration Screen */
        #celebration {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #fff0f3 0%, #ffccd5 100%);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
        }

        #celebration h2 {
            font-family: 'Pacifico', cursive;
            font-size: 5rem;
            color: var(--primary-pink);
            margin: 20px;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-shadow: 4px 4px 0px white;
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        .heart-confetti {
            position: fixed;
            pointer-events: none;
            z-index: 1010;
        }

        /* Swaying falling animation */
        @keyframes confettiFall {
            0% { 
                transform: translateY(-10vh) translateX(0) rotate(0deg); 
                opacity: 1; 
            }
            25% { transform: translateY(20vh) translateX(25px) rotate(90deg); }
            50% { transform: translateY(50vh) translateX(-25px) rotate(180deg); }
            75% { transform: translateY(80vh) translateX(25px) rotate(270deg); }
            100% { 
                transform: translateY(110vh) translateX(0) rotate(360deg); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <!-- Background Decoration -->
    <div id="bg-layers"></div>

    <div class="container" id="main-card">
        <span class="mascot" id="mascot-icon">🥺</span>
        <h1 id="question-text">Will you be my Valentine?</h1>
        
        <div class="btn-group">
            <button id="yesBtn" onclick="handleYes()">Yes! ❤️</button>
            <button id="noBtn">No 💔</button>
        </div>
    </div>

    <div id="celebration">
        <span class="mascot" style="font-size: 140px;">🥰</span>
        <h2>Yayyy! 💘</h2>
        <p style="font-size: 1.8rem; color: #a4133c; font-weight: bold;">I knew you'd say yes! 😍</p>
    </div>

    <script>
        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");
        const mascot = document.getElementById("mascot-icon");
        const card = document.getElementById("main-card");
        
        let yesScale = 1;
        let noAttempts = 0;

        // 1. Create Floating Background Hearts
        function createBgHeart() {
            const heart = document.createElement("div");
            heart.className = "bg-heart";
            heart.innerHTML = ["❤️", "💖", "💕", "💘"][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (Math.random() * 20 + 15) + "px";
            heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
            document.getElementById("bg-layers").appendChild(heart);
            
            setTimeout(() => heart.remove(), 7000);
        }
        setInterval(createBgHeart, 400);

        // 2. Logic for the 'Runaway' No Button
        document.addEventListener('mousemove', (e) => {
            const btnRect = noBtn.getBoundingClientRect();
            const btnCenterX = btnRect.left + btnRect.width / 2;
            const btnCenterY = btnRect.top + btnRect.height / 2;
            const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);

            if (distance < 120) {
                moveNoButton();
            }
        });

        noBtn.addEventListener('mouseover', moveNoButton);

        function moveNoButton() {
            noAttempts++;
            if (noBtn.parentElement !== document.body) {
                const rect = noBtn.getBoundingClientRect();
                noBtn.style.left = rect.left + "px";
                noBtn.style.top = rect.top + "px";
                noBtn.style.position = 'fixed';
                document.body.appendChild(noBtn);
            }

            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;
            const padding = 50;
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);

            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
            const randomRot = (Math.random() - 0.5) * 40;
            noBtn.style.transform = `rotate(${randomRot}deg)`;

            card.classList.remove('shake');
            void card.offsetWidth; 
            card.classList.add('shake');

            yesScale += 0.25;
            yesBtn.style.transform = `scale(${yesScale})`;
            
            const messages = ["No 💔", "Are you sure?", "Pleease?", "Wrong button!", "Try again!", "Nope! 🏃‍♂️", "Over here!", "Can't touch this!"];
            noBtn.innerText = messages[noAttempts % messages.length];

            if (noAttempts > 3) mascot.innerText = "😭";
            if (noAttempts > 7) mascot.innerText = "😢";
            if (noAttempts > 11) mascot.innerText = "😡";
            if (noAttempts > 15) mascot.innerText = "🤡";
        }

        // 3. Handle Yes click
        function handleYes() {
            document.getElementById("celebration").style.display = "flex";
            if (noBtn.parentNode) noBtn.parentNode.removeChild(noBtn);
            startHeartConfetti();
        }

        // 4. Enhanced Heart Fall Animation
        function startHeartConfetti() {
            const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ffffff'];
            // Dense rain of hearts
            for (let i = 0; i < 250; i++) {
                setTimeout(() => {
                    const confetti = document.createElement("div");
                    confetti.className = "heart-confetti";
                    confetti.innerHTML = ["❤️", "💖", "💘", "💕", "🌸", "✨"][Math.floor(Math.random() * 6)];
                    confetti.style.left = Math.random() * 100 + "vw";
                    confetti.style.top = "-10vh";
                    confetti.style.fontSize = (Math.random() * 35 + 15) + "px";
                    confetti.style.color = colors[Math.floor(Math.random() * colors.length)];
                    
                    const duration = Math.random() * 3 + 3; // Slower, more graceful fall
                    const delay = Math.random() * 2; // Staggered start times
                    
                    confetti.style.animation = `confettiFall ${duration}s ease-in forwards`;
                    confetti.style.animationDelay = `${delay}s`;
                    
                    document.body.appendChild(confetti);
                    // Remove after animation finishes
                    setTimeout(() => confetti.remove(), (duration + delay) * 1000);
                }, i * 12);
            }
        }
    </script>

</body>

</html>
